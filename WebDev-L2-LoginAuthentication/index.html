<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Simple Login System</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="auth-container">
      <section class="auth-card" id="authCard">
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to continue</p>

        <form id="loginForm">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />

          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            required
          />

          <button type="submit">Login</button>

          <p id="loginMessage" class="message"></p>
        </form>

        <p class="switch-text">
          Don't have an account?
          <button type="button" id="showRegister">Create Account</button>
        </p>
      </section>

      <section class="auth-card hidden" id="registerCard">
        <h1>Create Account</h1>
        <p class="subtitle">Register a new account</p>

        <form id="registerForm">
          <label for="registerName">Full Name</label>
          <input
            type="text"
            id="registerName"
            placeholder="Enter your name"
            required
          />

          <label for="registerEmail">Email</label>
          <input
            type="email"
            id="registerEmail"
            placeholder="Enter your email"
            required
          />

          <label for="registerPassword">Password</label>
          <input
            type="password"
            id="registerPassword"
            placeholder="Minimum 6 characters"
            required
          />

          <label for="confirmPassword">Confirm Password</label>
          <input
            type="password"
            id="confirmPassword"
            placeholder="Re-enter your password"
            required
          />

          <button type="submit">Register</button>

          <p id="registerMessage" class="message"></p>
        </form>

        <p class="switch-text">
          Already have an account?
          <button type="button" id="showLogin">Login</button>
        </p>
      </section>

      <section class="dashboard hidden" id="dashboard">
        <div>
          <p class="small-title">LOGIN SUCCESSFUL</p>
          <h1 id="welcomeMessage">Welcome!</h1>
          <p>You are currently logged in to your account.</p>
        </div>

        <button id="logoutBtn">Logout</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
