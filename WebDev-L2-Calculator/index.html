<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculator | OIBSIP</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <h1>Calculator</h1>

        <div class="calculator-display">
            <div id="previous-display"></div>
            <div id="current-display">0</div>
        </div>

        <div class="calculator-buttons">

            <button class="span-two action" data-action="clear">
                C
            </button>

            <button class="action" data-action="backspace">
                ⌫
            </button>

            <button class="operator" data-operator="/">
                ÷
            </button>

            <button class="number" data-number="7">7</button>
            <button class="number" data-number="8">8</button>
            <button class="number" data-number="9">9</button>

            <button class="operator" data-operator="*">×</button>

            <button class="number" data-number="4">4</button>
            <button class="number" data-number="5">5</button>
            <button class="number" data-number="6">6</button>

            <button class="operator" data-operator="-">−</button>

            <button class="number" data-number="1">1</button>
            <button class="number" data-number="2">2</button>
            <button class="number" data-number="3">3</button>

            <button class="operator" data-operator="+">+</button>

            <button class="number span-two" data-number="0">
                0
            </button>

            <button class="number" data-number=".">
                .
            </button>

            <button class="equals" data-action="equals">
                =
            </button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
